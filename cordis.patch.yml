# `@junjiangao/dsh-web-search-tavily` bundle patch: registers the Tavily search provider.
#
# This bundle only inserts its own plugin row. Selecting tavily as the active
# search provider stays a user-owned `web` seam decision: a patch row replaces
# the whole row config instead of deep-merging, and multiple provider bundles
# must not fight over the `web` row. With several search providers installed,
# pin tavily in the profile's cordis.patch.yml:
#
#   - id: web
#     config:
#       searchProvider: tavily   # restate every other key the web row carries
#
# On dsh 0.2.3 the base `web` row carries only `fetchProvider: http`; it sets
# no `searchProvider`, so leaving the row unconfigured keeps the seam's
# route-based automatic selection and lets `DSH_WEB_SEARCH_PROVIDER` apply.
# Once a profile sets `searchProvider` explicitly, config wins over the
# environment and the variable no longer selects the provider.

- insert:
    - id: web-search-tavily
      name: '@junjiangao/dsh-web-search-tavily'
